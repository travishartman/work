name: Update Recent Work links

on:
  # Daily schedule paused; restore to resume Google News updates.
  # schedule:
  #   - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-links
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Refresh Recent Work links
        run: python3 tools/scrape_reuters.py

      - name: Commit changes if any
        run: |
          if git diff --quiet index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update Recent Work links"
          git push
