name: Remote job alerts

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      include_backlog:
        description: "Email current matches for feeds that have no saved state yet"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.31"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Email new remote postings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          INCLUDE_BACKLOG: ${{ inputs.include_backlog }}
        run: |
          if [ "$INCLUDE_BACKLOG" = "true" ]; then
            python3 tools/job_alerts.py --include-backlog
          else
            python3 tools/job_alerts.py
          fi

      - name: Save seen-postings state
        run: |
          if git diff --quiet -- data/jobs-seen.json && [ -z "$(git ls-files --others --exclude-standard data/jobs-seen.json)" ]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs-seen.json
          git commit -m "Update seen job postings"
          git pull --rebase origin main
          git push
